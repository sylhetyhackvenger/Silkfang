<svg width="1000" height="340" viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#05060a"/>
    <stop offset="55%" stop-color="#0a0d14"/>
    <stop offset="100%" stop-color="#0d0407"/>
  </linearGradient>

  <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ff1744" stop-opacity="0.55"/>
    <stop offset="70%" stop-color="#ff1744" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#ff1744" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ff1744" stop-opacity="0"/>
    <stop offset="100%" stop-color="#ff1744" stop-opacity="0.9"/>
  </linearGradient>

  <linearGradient id="scanBeam" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ff1744" stop-opacity="0"/>
    <stop offset="45%" stop-color="#ff1744" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#ff1744" stop-opacity="0"/>
  </linearGradient>

  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.4" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>

  <clipPath id="frame">
    <rect x="0" y="0" width="1000" height="340" rx="10"/>
  </clipPath>
</defs>

<g clip-path="url(#frame)">
  <rect width="1000" height="340" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#ff1744" stroke-opacity="0.07" stroke-width="1">
    <path d="M0,42 H1000 M0,84 H1000 M0,126 H1000 M0,168 H1000 M0,210 H1000 M0,252 H1000 M0,294 H1000"/>
    <path d="M90,0 V340 M180,0 V340 M270,0 V340 M360,0 V340 M450,0 V340 M540,0 V340 M630,0 V340 M720,0 V340 M810,0 V340 M900,0 V340"/>
  </g>

  <!-- vertical scan beam sweeping across the whole banner -->
  <rect x="-40" y="0" width="40" height="340" fill="url(#scanBeam)">
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 1080,0; 1080,0" keyTimes="0;0.92;1"
      dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- ============ RADAR MODULE ============ -->
  <g transform="translate(150,172)">
    <circle r="112" fill="url(#radarGlow)"/>
    <circle r="108" fill="none" stroke="#ff1744" stroke-opacity="0.35" stroke-width="1"/>
    <circle r="78" fill="none" stroke="#ff1744" stroke-opacity="0.28" stroke-width="1"/>
    <circle r="46" fill="none" stroke="#ff1744" stroke-opacity="0.22" stroke-width="1"/>
    <circle r="14" fill="none" stroke="#ff1744" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="-112" y1="0" x2="112" y2="0" stroke="#ff1744" stroke-opacity="0.15"/>
    <line x1="0" y1="-112" x2="0" y2="112" stroke="#ff1744" stroke-opacity="0.15"/>

    <!-- sweep wedge -->
    <g>
      <path d="M0,0 L112,0 A112,112 0 0 1 79.2,79.2 Z" fill="url(#sweepGrad)" opacity="0.75">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      </path>
      <line x1="0" y1="0" x2="112" y2="0" stroke="#ff4569" stroke-width="1.6" filter="url(#glow)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- blips detected on the radar -->
    <g fill="#ff5568" filter="url(#glow)">
      <circle cx="54" cy="-38" r="3.2">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.2;0.3" dur="4s" begin="0.15s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-66" cy="20" r="3.2">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.2;0.3" dur="4s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="18" cy="70" r="3.2">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.2;0.3" dur="4s" begin="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-30" cy="-78" r="3.2">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.2;0.3" dur="4s" begin="3.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="88" cy="30" r="3.2">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.2;0.3" dur="4s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- centre node -->
    <circle r="5" fill="#ffffff"/>
    <circle r="5" fill="#ff1744">
      <animate attributeName="r" values="5;16;5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ CRAWL / ATTACK-SURFACE GRAPH ============ -->
  <g transform="translate(150,172)" stroke="#ff1744" stroke-opacity="0.55" stroke-width="1.1" fill="none">
    <path d="M0,0 L54,-38 M0,0 L-66,20 M0,0 L18,70 M0,0 L-30,-78 M0,0 L88,30">
      <animate attributeName="stroke-opacity" values="0.1;0.6;0.1" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#9aa0ad" font-family="Consolas, 'Courier New', monospace" font-size="9">
    <text x="214" y="122">host</text>
    <text x="78" y="200">api.*</text>
    <text x="178" y="252">cdn</text>
    <text x="108" y="82">waf</text>
    <text x="246" y="192">assets</text>
  </g>

  <!-- ============ DIVIDER ============ -->
  <line x1="320" y1="24" x2="320" y2="316" stroke="#ff1744" stroke-opacity="0.25"/>

  <!-- ============ TITLE ============ -->
  <g font-family="Consolas, 'Courier New', monospace">
    <text x="346" y="54" font-size="34" font-weight="700" fill="#f2f3f5" letter-spacing="3">
      SILK<tspan fill="#ff2a44">FANG</tspan>
    </text>
    <text x="346" y="54" font-size="34" font-weight="700" fill="#ff1744" letter-spacing="3" opacity="0">
      SILK<tspan fill="#ff2a44">FANG</tspan>
      <animate attributeName="opacity" values="0;0.75;0;0;0.55;0" keyTimes="0;0.04;0.08;0.5;0.53;0.58" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x" values="346;348;344;346" dur="5s" keyTimes="0;0.04;0.08;1" repeatCount="indefinite"/>
    </text>
    <text x="347" y="74" font-size="11.5" fill="#8d94a0" letter-spacing="1.5">SILENT. SHARP. PRECISE.</text>
  </g>

  <!-- blinking live indicator -->
  <g transform="translate(346,90)">
    <circle cx="0" cy="0" r="4" fill="#ff1744">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.1s" repeatCount="indefinite"/>
    </circle>
    <text x="12" y="4" font-family="Consolas, monospace" font-size="10.5" fill="#ff5568" letter-spacing="1">LIVE RECON STREAM</text>
  </g>

  <!-- ============ TERMINAL FEED ============ -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="12.5">
    <rect x="340" y="104" width="636" height="190" rx="4" fill="#0a0b10" stroke="#ff1744" stroke-opacity="0.18"/>

    <g clip-path="url(#frame)">
    <!-- terminal top bar -->
    <circle cx="354" cy="116" r="3.2" fill="#ff5f56"/>
    <circle cx="366" cy="116" r="3.2" fill="#ffbd2e"/>
    <circle cx="378" cy="116" r="3.2" fill="#27c93f"/>
    <text x="920" y="120" font-size="9.5" fill="#5b6070" text-anchor="end">silkfang --unlimited -y</text>

    <g fill="#c7cbd4">
      <g>
        <text x="354" y="146"><tspan fill="#5b6070">12:34:56</tspan> <tspan fill="#ff3b52">CRIT</tspan> SECRET          → AWS-KEY AKIA***EXAMPLE</text>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.01;0.06;0.78;0.82" dur="9s" repeatCount="indefinite"/>
      </g>
      <g>
        <text x="354" y="168"><tspan fill="#5b6070">12:34:57</tspan> <tspan fill="#ff3b52">HIGH</tspan> DOM-XSS         → location.hash → innerHTML</text>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.09;0.15;0.78;0.82" dur="9s" repeatCount="indefinite"/>
      </g>
      <g>
        <text x="354" y="190"><tspan fill="#5b6070">12:34:58</tspan> <tspan fill="#ffb020">MED </tspan> HDR-            → CSP MISSING</text>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.17;0.23;0.78;0.82" dur="9s" repeatCount="indefinite"/>
      </g>
      <g>
        <text x="354" y="212"><tspan fill="#5b6070">12:34:59</tspan> <tspan fill="#ff3b52">CRIT</tspan> SUBDOMAIN-TAKEOVER → staging via S3</text>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.31;0.78;0.82" dur="9s" repeatCount="indefinite"/>
      </g>
      <g>
        <text x="354" y="234"><tspan fill="#5b6070">12:35:00</tspan> <tspan fill="#2fd0ff">INFO</tspan> TECH-ID         → WordPress 6.4</text>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.33;0.39;0.78;0.82" dur="9s" repeatCount="indefinite"/>
      </g>
      <g>
        <text x="354" y="256"><tspan fill="#5b6070">12:35:01</tspan> <tspan fill="#ffb020">MED </tspan> CORS            → wildcard + credentials</text>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.41;0.47;0.78;0.82" dur="9s" repeatCount="indefinite"/>
      </g>
      <g>
        <text x="354" y="278"><tspan fill="#5b6070">12:35:02</tspan> <tspan fill="#2fd0ff">INFO</tspan> SENSITIVE-200   → /.env.local len=2048</text>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.49;0.55;0.78;0.82" dur="9s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- blinking cursor -->
    <rect x="354" y="282" width="7" height="12" fill="#ff1744">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    </g>
  </g>

  <!-- bottom status strip -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#6b7180">
    <line x1="0" y1="316" x2="1000" y2="316" stroke="#ff1744" stroke-opacity="0.2"/>
    <text x="20" y="332">mode=ALL</text>
    <text x="110" y="332">pages=142/∞</text>
    <text x="220" y="332">findings=1042</text>
    <text x="340" y="332" fill="#ff5568">crit=3</text>
    <text x="400" y="332" fill="#ffb020">high=47</text>
    <text x="462" y="332">med=82</text>
    <text x="520" y="332">low=201</text>
    <text x="578" y="332">info=709</text>
    <text x="900" y="332" text-anchor="end" fill="#ff5568">● AUTHORIZED TARGETS ONLY</text>
  </g>

  <!-- outer frame -->
  <rect x="1" y="1" width="998" height="338" rx="9" fill="none" stroke="#ff1744" stroke-opacity="0.35" stroke-width="1.5"/>
</g>
</svg>
